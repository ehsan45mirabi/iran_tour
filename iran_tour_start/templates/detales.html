<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iran tour detales</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
 
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', Tahoma, sans-serif !important;
}
 
html { -webkit-text-size-adjust: 100%; }
body { background: #fff; overflow-x: hidden; }
img { max-width: 100%; }
 
/* ================= نوار بالا ================= */
.nav{
    position: sticky;
    top: 0;
    z-index: 100;
    direction: ltr;
    display: grid;
    grid-template-columns: 1fr auto 1fr;   /* لوگو | لینک‌ها (وسط) | دکمه‌ها */
    align-items: center;
    padding: 12px 25px;
    min-height: 70px;
    background-color: #102B43;
}
 
.nav h1{
    color: white;
    font-size: 24px;
    white-space: nowrap;
}
 
/* دکمه همبرگری (فقط موبایل) */
.menu-toggle{
    display: none;
    background: transparent;
    border: 1px solid rgba(255,255,255,.35);
    color: white;
    font-size: 24px;
    line-height: 1;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
}
 
.menu{
    display: contents;
}
 
.div1{
    direction: rtl;
    display: flex;
    gap: 50px;
}
 
.div1 a{
    text-decoration: none;
    color: white;
}
 
.div2{
    direction: rtl;
    display: flex;
    align-items: center;
    gap: 30px;
    justify-self: end;
}
 
.div2 a{
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    padding: 5px;
    width: 120px;
    background-color: #0D9488;
    white-space: nowrap;
}
 
/* ================= محتوای صفحه ================= */
.counter{
    direction: rtl;
    display: flex;
    align-items: stretch;
    gap: 24px;
    padding: 20px 5% 40px;
}
 
.div3{
    flex: 0 0 36%;
    min-height: 400px;
}
 
.div3 img{
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 15px;
}
 
.div4{
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 24px 28px 32px;
    color: antiquewhite;
    border-radius: 15px;
    background-color: #102B43;
}
 
.div4 h2{
    text-align: center;
    font-size: 26px;
    line-height: 1.6;
}
 
.p{
    margin-top: 20px;
    line-height: 2;
    font-size: 15px;
}
 
.div4 h3{
    margin-top: 32px;
    text-align: center;
    font-size: 19px;
}
 
.div4 ul{
    margin-top: 16px;
    list-style-position: inside;
    text-align: center;
}
 
.div4 li{
    margin-bottom: 12px;
    line-height: 1.9;
}
 
.div4 a{
    display: flex;
    justify-content: center;
    margin: auto auto 0;
    margin-top: 28px;
    width: 260px;
    max-width: 100%;
    text-decoration: none;
    border-radius: 17px;
    padding: 9px;
    background-color: #0D9488;
    color: white;
    text-align: center;
}
 
/* ================= لپ‌تاپ کوچک / تبلت ================= */
@media (max-width: 1200px) {
  .div1 { gap: 28px; }
  .div2 { gap: 16px; }
  .div3 { flex-basis: 40%; }
}
 
/* ================= موبایل و تبلت کوچک ================= */
@media (max-width: 1000px) {
  .nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    padding: 10px 16px;
    min-height: 64px;
  }
 
  .nav h1 { font-size: 21px; }
 
  .menu-toggle { display: block; }
 
  .menu {
    display: none;
    flex-basis: 100%;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    margin: 12px 0 6px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.15);
    direction: rtl;
  }
 
  .menu.open { display: flex; }
 
  .div1 {
    flex-direction: column;
    gap: 0;
  }
 
  .div1 a {
    padding: 13px 8px;
    font-size: 15px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
 
  .div2 {
    flex-direction: column-reverse;
    align-items: stretch;
    gap: 12px;
  }
 
  .div2 a {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border-radius: 12px;
  }
 
  /* عکس بالا، متن پایین */
  .counter {
    flex-direction: column;
    gap: 16px;
    padding: 16px 16px 32px;
  }
 
  .div3 {
    flex: none;
    min-height: 0;
    height: clamp(220px, 50vw, 380px);
  }
}
 
@media (max-width: 600px) {
  .div4 { padding: 20px 18px 24px; }
  .div4 h2 { font-size: 21px; }
  .p { font-size: 14px; }
  .div4 h3 { font-size: 17px; margin-top: 26px; }
  .div4 li { font-size: 14px; }
  .div4 a { width: 100%; }
}
 
@media (max-width: 380px) {
  .div3 { height: 200px; }
}
    </style>
</head>
<body>
    <nav class="nav">
        <h1>iran tour</h1>
 
        <button class="menu-toggle" id="menuToggle" aria-label="باز کردن منو" aria-expanded="false" aria-controls="menu">☰</button>
 
        <div class="menu" id="menu">
            <div class="div1">
                <a href="{% url 'home_url' %}">صفحه اصلی</a>
                <a href="{% url 'about_url' %}">درباره ما </a>
                <a href="{% url 'maghsad_url' %}">مقاصد گردشگری</a>
                <a href="">نمی دونی کجا بری ؟</a>
            </div>
            <div class="div2">
                <a href="{% url 'login_register_url' %}">ورود / ثبت نام</a>
            </div>
        </div>
    </nav>
 
    <div class="counter">
 
        <div class="div3">
            <img src="{{details.image_2}}" alt="{{details.title_details}}">
        </div>
 
        <div class="div4">
            <h2>{{details.title_details}}</h2>
            <p class="p">
                {{details.descriptions}}
            </p>
 
            <h3>چرا باید از این منظره دیدن کرد ؟</h3>
            <ul>
                <li>{{details.trait_1}}</li>
                <li>{{details.trait_2}}</li>
                <li>{{details.trait_3}}</li>
                <li>{{details.trait_4}}</li>
            </ul>
 
            <a href="{{details.map_locations}}">مسیریابی کنید و لذت ببرید</a>
        </div>
    </div>
 
    <script>
      const toggle = document.getElementById('menuToggle');
      const menu = document.getElementById('menu');
 
      toggle.addEventListener('click', () => {
        const open = menu.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open);
        toggle.textContent = open ? '✕' : '☰';
      });
    </script>
</body>
</html>
